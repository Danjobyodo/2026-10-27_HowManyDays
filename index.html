<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>何日間？ - 日数計算</title>
  <meta name="description" content="2つの日付の間が何日離れているかを計算します。閏年にも対応、オフラインでも使えます。">
  <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="何日間？">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>何日間？</h1>
      <p class="lead">2つの日付が何日離れているかを計算します</p>
    </header>

    <form id="calc-form" class="form" novalidate>
      <div class="field">
        <label for="date-from">開始日</label>
        <div class="row">
          <input type="date" id="date-from" name="from" min="0001-01-01" max="9999-12-31" required>
          <span id="weekday-from" class="weekday is-empty" aria-live="polite">−</span>
        </div>
        <button type="button" class="link" data-today="date-from">今日にする</button>
      </div>

      <div class="swap-wrap">
        <button type="button" id="swap" class="swap" aria-label="開始日と終了日を入れ替える" title="入れ替え">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4v13m0 0-3-3m3 3 3-3M17 20V7m0 0-3 3m3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="field">
        <label for="date-to">終了日</label>
        <div class="row">
          <input type="date" id="date-to" name="to" min="0001-01-01" max="9999-12-31" required>
          <span id="weekday-to" class="weekday is-empty" aria-live="polite">−</span>
        </div>
        <button type="button" class="link" data-today="date-to">今日にする</button>
      </div>

      <button type="submit" class="primary">計算する</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="result" aria-live="polite" hidden>
      <p class="result-main"><span id="result-value" class="result-value">0</span><span class="unit">日</span></p>
      <ul id="result-detail" class="result-detail"></ul>
    </section>

    <footer class="footer">
      <p>閏年を含む先発グレゴリオ暦で計算しています。オフラインでも利用できます。</p>
    </footer>
  </main>

  <script src="./js/date-utils.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
